<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turnos Voluntariado</title>
  <style>
    :root{
      --azul:#2563eb; --azul-osc:#1d4ed8; --verde:#16a34a; --rojo:#dc2626;
      --gris:#f1f5f9; --gris-osc:#64748b; --borde:#e2e8f0; --texto:#1e293b;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
      background:var(--gris); color:var(--texto);
    }
    #app{max-width:480px; margin:0 auto; min-height:100vh; background:#fff; box-shadow:0 0 20px rgba(0,0,0,.06);}
    section{padding:20px 18px 90px;}
    .oculto{display:none !important;}
    h2{font-size:1.25rem; margin:4px 0 18px;}
    h3{font-size:1rem; margin:22px 0 10px; color:var(--gris-osc); text-transform:uppercase; letter-spacing:.03em; font-size:.8rem;}
    header{background:var(--azul); color:#fff; padding:16px 18px; font-weight:600; font-size:1.05rem; display:flex; align-items:center; gap:8px;}
    label{display:block; font-size:.85rem; color:var(--gris-osc); margin:14px 0 6px;}
    select, input{
      width:100%; padding:12px 14px; font-size:1rem; border:1px solid var(--borde);
      border-radius:10px; background:#fff; color:var(--texto);
    }
    button{
      width:100%; padding:13px 14px; font-size:1rem; font-weight:600; border:none;
      border-radius:10px; background:var(--azul); color:#fff; margin-top:16px; cursor:pointer;
    }
    button:active{background:var(--azul-osc);}
    button.secundario{background:transparent; color:var(--azul); border:1px solid var(--borde); margin-top:8px;}
    button.chico{width:auto; padding:7px 12px; font-size:.8rem; margin:0;}
    button:disabled{background:#cbd5e1; cursor:not-allowed;}
    button.peligro{background:var(--rojo);}
    .error{color:var(--rojo); font-size:.85rem; margin-top:10px; min-height:1em;}
    .exito{color:var(--verde); font-size:.85rem; margin-top:10px; min-height:1em;}
    .admin-link{text-align:center; color:var(--gris-osc); font-size:.8rem; margin-top:26px; text-decoration:underline; cursor:pointer;}
    .barra-usuario{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--borde);}
    .barra-usuario span{font-weight:600;}
    .tabs{display:flex; gap:8px; margin-bottom:16px;}
    .tab{flex:1; margin:0; background:var(--gris); color:var(--texto); font-weight:600;}
    .tab.activo{background:var(--azul); color:#fff;}
    .card{border:1px solid var(--borde); border-radius:12px; padding:14px; margin-bottom:12px;}
    .card h4{margin:0 0 4px; font-size:1.05rem;}
    .card .meta{font-size:.85rem; color:var(--gris-osc); margin-bottom:8px;}
    .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:.75rem; font-weight:600; margin-bottom:8px;}
    .badge.ok{background:#dcfce7; color:#166534;}
    .badge.lleno{background:#fee2e2; color:#991b1b;}
    .badge.cerrado{background:#f1f5f9; color:var(--gris-osc);}
    .inscritos{font-size:.82rem; color:var(--gris-osc); margin:6px 0;}
    .inscritos b{color:var(--texto);}
    .vacio{text-align:center; color:var(--gris-osc); padding:30px 10px; font-size:.9rem;}
    .fila-admin{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
    .fila-admin input[type=number]{width:70px; padding:8px;}
    .fila-admin button{width:auto; margin:0; padding:8px 12px; font-size:.85rem;}
    .toggle-mes{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--borde);}
    table{width:100%; border-collapse:collapse; font-size:.82rem;}
    table th, table td{text-align:left; padding:7px 4px; border-bottom:1px solid var(--borde);}
    table th{color:var(--gris-osc); font-weight:600;}
    .cancelada{color:var(--gris-osc); text-decoration:line-through;}
    .logo-app{display:block; margin:0 auto 10px; width:130px; height:auto;}
    .campo-clave{position:relative;}
    .campo-clave input{padding-right:64px;}
    .btn-ver{position:absolute; right:4px; top:4px; width:auto !important; margin:0 !important; padding:8px 10px !important; font-size:.72rem !important; background:transparent !important; color:var(--azul) !important; border:1px solid var(--borde) !important;}
    .modal-overlay{position:fixed; inset:0; background:rgba(15,23,42,.5); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999;}
    .modal-caja{background:#fff; border-radius:14px; padding:22px; max-width:340px; width:100%;}
    .modal-caja h3{font-size:1.05rem; margin:0 0 10px; text-transform:none; letter-spacing:normal; color:var(--texto);}
    .modal-caja p{font-size:.9rem; color:var(--gris-osc); margin:0; line-height:1.4;}
  </style>
</head>

    <h2>Selecciona tu curso</h2>
    <select id="select-curso"></select>
    <button onclick="elegirCurso()">Continuar</button>
    <div class="admin-link" onclick="mostrarPantalla('pantalla-admin-login')">Ingresar como administrador/a</div>
  </section>

  <!-- 2. SELECCIÓN DE ALUMNO + CLAVE -->
  <section id="pantalla-alumno" class="oculto">
    <h2>Selecciona tu nombre</h2>
    <select id="select-alumno"></select>
    <label>Clave (tu segundo apellido)</label>
    <div class="campo-clave">
      <input type="password" id="input-clave" autocomplete="off">
      <button type="button" class="btn-ver" id="btn-ver-clave" onclick="alternarClave_()">Ver</button>
    </div>
    <div id="error-login" class="error"></div>
    <button onclick="hacerLogin()">Ingresar</button>
    <button class="secundario" onclick="mostrarPantalla('pantalla-curso')">Volver</button>
  </section>

  <!-- 3. APP PRINCIPAL -->
  <section id="pantalla-principal" class="oculto">
    <div class="barra-usuario">
      <span id="nombre-usuario"></span>
      <button class="chico secundario" onclick="cerrarSesion()">Salir</button>
    </div>
    <div class="tabs">
      <button id="tab-eventos" class="tab activo" onclick="mostrarTab('eventos')">Eventos</button>
      <button id="tab-mis" class="tab" onclick="mostrarTab('mis')">Mis inscripciones</button>
    </div>
    <div id="mensaje-app" class="exito"></div>
    <div id="lista-eventos"></div>
    <div id="lista-mis" class="oculto"></div>
  </section>

  <!-- 4. LOGIN ADMIN -->
  <section id="pantalla-admin-login" class="oculto">
    <h2>Acceso administrador/a</h2>
    <input type="password" id="input-clave-admin" placeholder="Clave de administrador/a" autocomplete="off">
    <div id="error-admin" class="error"></div>
    <button onclick="hacerLoginAdmin()">Ingresar</button>
    <button class="secundario" onclick="mostrarPantalla('pantalla-curso')">Volver</button>
  </section>

  <!-- 5. PANEL ADMIN -->
  <section id="pantalla-admin" class="oculto">
    <div class="barra-usuario">
      <span>Panel administrador/a</span>
      <button class="chico secundario" onclick="cerrarSesionAdmin()">Salir</button>
    </div>
    <h3>Abrir / cerrar por mes</h3>
    <div id="controles-mes"></div>
    <h3>Eventos</h3>
    <div id="lista-eventos-admin"></div>
    <h3>Todas las inscripciones</h3>
    <div id="tabla-inscripciones"></div>
  </section>

  <!-- VENTANA DE CONFIRMACIÓN -->
  <div id="modal-overlay" class="modal-overlay oculto">
    <div class="modal-caja">
      <h3 id="modal-titulo">Confirmar</h3>
      <p id="modal-mensaje"></p>
      <button id="modal-btn-confirmar" onclick="confirmarModal_()">Confirmar</button>
      <button class="secundario" onclick="cerrarModal_()">Cancelar</button>
    </div>
  </div>
</div>

<script>
  var estado = { curso: null, nombres: null, primerApellido: null, clave: null };
  var claveAdmin = null;
  var alumnosCurso = [];
  var misIdsInscrito = [];
  var pestanaActiva = 'eventos';
  var procesando = false;

  function mostrarError_() {
    procesando = false;
    document.getElementById('mensaje-app').className = 'error';
    document.getElementById('mensaje-app').textContent = 'Ocurrió un error de conexión, intenta de nuevo.';
  }

  /* ---------- VER/OCULTAR CLAVE ---------- */

  function alternarClave_() {
    var input = document.getElementById('input-clave');
    var btn = document.getElementById('btn-ver-clave');
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = 'Ocultar';
    } else {
      input.type = 'password';
      btn.textContent = 'Ver';
    }
  }

  /* ---------- VENTANA DE CONFIRMACIÓN ---------- */

  var accionModal_ = null;
  var eventosCache_ = {};

  function mostrarConfirmacion_(titulo, mensaje, alConfirmar) {
    document.getElementById('modal-titulo').textContent = titulo;
    document.getElementById('modal-mensaje').textContent = mensaje;
    accionModal_ = alConfirmar;
    document.getElementById('modal-overlay').classList.remove('oculto');
  }

  function cerrarModal_() {
    document.getElementById('modal-overlay').classList.add('oculto');
    accionModal_ = null;
  }

  function confirmarModal_() {
    var accion = accionModal_;
    cerrarModal_();
    if (accion) accion();
  }

  function confirmarInscripcion(eventoId) {
    var e = eventosCache_[String(eventoId)];
    var detalle = e ? (e.evento + ' el ' + e.fecha + ', de ' + e.horaInicio + ' a ' + e.horaFin) : 'este evento';
    mostrarConfirmacion_('Confirmar inscripción', '¿Confirmas tu inscripción a ' + detalle + '?', function () {
      inscribirme(eventoId);
    });
  }

  function confirmarCancelacion(eventoId) {
    var e = eventosCache_[String(eventoId)];
    var detalle = e ? (e.evento + ' el ' + e.fecha) : 'este evento';
    mostrarConfirmacion_('Cancelar inscripción', '¿Seguro que quieres cancelar tu inscripción a ' + detalle + '?', function () {
      cancelar(eventoId);
    });
  }

  function mostrarPantalla(id) {
    ['pantalla-carga','pantalla-curso','pantalla-alumno','pantalla-principal','pantalla-admin-login','pantalla-admin']
      .forEach(function (s) { document.getElementById(s).classList.add('oculto'); });
    document.getElementById(id).classList.remove('oculto');
  }

  window.onload = function () {
    google.script.run.withSuccessHandler(function (cursos) {
      var sel = document.getElementById('select-curso');
      sel.innerHTML = cursos.map(function (c) { return '<option value="'+c+'">'+c+'</option>'; }).join('');
      intentarRestaurarSesion_();
    }).getCursos();
  };

  /* ---------- PERSISTENCIA DE SESIÓN (para que sobreviva a un refresco de página) ---------- */

  var CLAVE_SESION_ALUMNO = 'tv_sesion_alumno';
  var CLAVE_SESION_ADMIN = 'tv_sesion_admin';

  function guardarSesionAlumno_() {
    sessionStorage.setItem(CLAVE_SESION_ALUMNO, JSON.stringify(estado));
  }

  function borrarSesionAlumno_() {
    sessionStorage.removeItem(CLAVE_SESION_ALUMNO);
  }

  function guardarSesionAdmin_() {
    sessionStorage.setItem(CLAVE_SESION_ADMIN, claveAdmin);
  }

  function borrarSesionAdmin_() {
    sessionStorage.removeItem(CLAVE_SESION_ADMIN);
  }

  function intentarRestaurarSesion_() {
    var guardado = sessionStorage.getItem(CLAVE_SESION_ALUMNO);
    var claveGuardada = sessionStorage.getItem(CLAVE_SESION_ADMIN);

    if (!guardado && !claveGuardada) {
      mostrarPantalla('pantalla-curso');
      return;
    }

    if (guardado) {
      try {
        var datos = JSON.parse(guardado);
        google.script.run
          .withSuccessHandler(function (resp) {
            if (resp && resp.ok) {
              estado = datos;
              document.getElementById('nombre-usuario').textContent = datos.nombres + ' ' + datos.primerApellido + ' · ' + datos.curso;
              mostrarPantalla('pantalla-principal');
              mostrarTab('eventos');
            } else {
              borrarSesionAlumno_();
              mostrarPantalla('pantalla-curso');
            }
          })
          .withFailureHandler(function () { mostrarPantalla('pantalla-curso'); })
          .login(datos.curso, datos.nombres, datos.primerApellido, datos.clave);
        return;
      } catch (e) {
        borrarSesionAlumno_();
      }
    }

    if (claveGuardada) {
      google.script.run
        .withSuccessHandler(function (resp) {
          if (resp && resp.ok) {
            claveAdmin = claveGuardada;
            mostrarPantalla('pantalla-admin');
            cargarAdmin();
          } else {
            borrarSesionAdmin_();
            mostrarPantalla('pantalla-curso');
          }
        })
        .withFailureHandler(function () { mostrarPantalla('pantalla-curso'); })
        .loginAdmin(claveGuardada);
      return;
    }

    mostrarPantalla('pantalla-curso');
  }

  /* ---------- LOGIN ALUMNO ---------- */

  function elegirCurso() {
    var curso = document.getElementById('select-curso').value;
    estado.curso = curso;
    google.script.run.withSuccessHandler(function (alumnos) {
      alumnosCurso = alumnos;
      var sel = document.getElementById('select-alumno');
      sel.innerHTML = alumnos.map(function (a, i) {
        return '<option value="'+i+'">'+a.nombres+' '+a.primerApellido+'</option>';
      }).join('');
      document.getElementById('input-clave').value = '';
      document.getElementById('error-login').textContent = '';
      mostrarPantalla('pantalla-alumno');
    }).getAlumnosPorCurso(curso);
  }

  function hacerLogin() {
    var idx = document.getElementById('select-alumno').value;
    var alumno = alumnosCurso[idx];
    var clave = document.getElementById('input-clave').value;
    document.getElementById('error-login').textContent = '';
    google.script.run
      .withSuccessHandler(function (resp) {
        if (!resp.ok) {
          document.getElementById('error-login').textContent = 'Clave incorrecta. Intenta de nuevo.';
          return;
        }
        estado.nombres = alumno.nombres;
        estado.primerApellido = alumno.primerApellido;
        estado.clave = clave;
        guardarSesionAlumno_();
        document.getElementById('nombre-usuario').textContent = alumno.nombres + ' ' + alumno.primerApellido + ' · ' + estado.curso;
        mostrarPantalla('pantalla-principal');
        mostrarTab('eventos');
      })
      .withFailureHandler(function () {
        document.getElementById('error-login').textContent = 'Ocurrió un error de conexión, intenta de nuevo.';
      })
      .login(estado.curso, alumno.nombres, alumno.primerApellido, clave);
  }

  function cerrarSesion() {
    estado = { curso: null, nombres: null, primerApellido: null, clave: null };
    borrarSesionAlumno_();
    mostrarPantalla('pantalla-curso');
  }

  /* ---------- EVENTOS (VISTA ALUMNO) ---------- */

  function mostrarTab(tab) {
    pestanaActiva = tab;
    document.getElementById('tab-eventos').classList.toggle('activo', tab === 'eventos');
    document.getElementById('tab-mis').classList.toggle('activo', tab === 'mis');
    document.getElementById('lista-eventos').classList.toggle('oculto', tab !== 'eventos');
    document.getElementById('lista-mis').classList.toggle('oculto', tab !== 'mis');
    document.getElementById('mensaje-app').textContent = '';
    if (tab === 'eventos') cargarEventos(); else cargarMisInscripciones();
  }

  function cargarEventos() {
    document.getElementById('lista-eventos').innerHTML = '<div class="vacio">Cargando…</div>';
    google.script.run
      .withSuccessHandler(function (resp) {
        if (!resp.ok) { mostrarError_(); document.getElementById('mensaje-app').textContent = resp.mensaje; return; }
        misIdsInscrito = resp.misIds;
        renderEventos(resp.eventos);
      })
      .withFailureHandler(mostrarError_)
      .getPantallaEventos(estado.curso, estado.nombres, estado.primerApellido, estado.clave);
  }

  function renderEventos(eventos) {
    var cont = document.getElementById('lista-eventos');
    eventos.forEach(function (e) { eventosCache_[String(e.id)] = e; });
    if (!eventos.length) {
      cont.innerHTML = '<div class="vacio">No hay eventos abiertos para inscripción por el momento.</div>';
      return;
    }
    cont.innerHTML = eventos.map(function (e) {
      var yaInscrito = misIdsInscrito.indexOf(String(e.id)) !== -1;
      var badge = e.disponibles <= 0 && !yaInscrito
        ? '<span class="badge lleno">Sin cupos</span>'
        : '<span class="badge ok">'+e.disponibles+' de '+e.cupo+' cupos</span>';
      var listaInscritos = e.inscritos.length
        ? '<div class="inscritos"><b>Ya inscritos:</b> ' + e.inscritos.join(', ') + '</div>'
        : '<div class="inscritos">Nadie se ha inscrito todavía.</div>';
      var boton;
      if (procesando) {
        boton = '<button disabled>Procesando…</button>';
      } else if (yaInscrito) {
        boton = '<button class="peligro" onclick="confirmarCancelacion(\''+e.id+'\')">Cancelar mi inscripción</button>';
      } else if (e.disponibles <= 0) {
        boton = '<button disabled>Sin cupos disponibles</button>';
      } else {
        boton = '<button onclick="confirmarInscripcion(\''+e.id+'\')">Inscribirme</button>';
      }
      return '<div class="card">' +
        '<h4>'+e.evento+'</h4>' +
        '<div class="meta">'+e.fecha+' · '+e.horaInicio+' a '+e.horaFin+'</div>' +
        badge + listaInscritos + boton +
        '</div>';
    }).join('');
  }

  function actualizarTrasAccion_(resp, eventoId, agregar) {
    procesando = false;
    document.getElementById('mensaje-app').className = resp.ok ? 'exito' : 'error';
    document.getElementById('mensaje-app').textContent = resp.mensaje;
    if (resp.ok) {
      if (agregar && misIdsInscrito.indexOf(String(eventoId)) === -1) misIdsInscrito.push(String(eventoId));
      if (!agregar) misIdsInscrito = misIdsInscrito.filter(function (id) { return id !== String(eventoId); });
    }
    if (pestanaActiva === 'eventos' && resp.eventos) {
      renderEventos(resp.eventos);
    } else if (pestanaActiva === 'mis') {
      cargarMisInscripciones();
    }
  }

  function inscribirme(eventoId) {
    if (procesando) return;
    procesando = true;
    document.getElementById('mensaje-app').className = 'exito';
    document.getElementById('mensaje-app').textContent = 'Inscribiendo…';
    google.script.run
      .withSuccessHandler(function (resp) { actualizarTrasAccion_(resp, eventoId, true); })
      .withFailureHandler(mostrarError_)
      .inscribir(estado.curso, estado.nombres, estado.primerApellido, estado.clave, eventoId);
  }

  function cancelar(eventoId) {
    if (procesando) return;
    procesando = true;
    document.getElementById('mensaje-app').className = 'exito';
    document.getElementById('mensaje-app').textContent = 'Cancelando…';
    google.script.run
      .withSuccessHandler(function (resp) { actualizarTrasAccion_(resp, eventoId, false); })
      .withFailureHandler(mostrarError_)
      .cancelarInscripcion(estado.curso, estado.nombres, estado.primerApellido, estado.clave, eventoId);
  }

  function cargarMisInscripciones() {
    document.getElementById('lista-mis').innerHTML = '<div class="vacio">Cargando…</div>';
    google.script.run
      .withSuccessHandler(function (mias) {
        var cont = document.getElementById('lista-mis');
        mias.forEach(function (e) { eventosCache_[String(e.id)] = e; });
        if (!mias.length) {
          cont.innerHTML = '<div class="vacio">Aún no te has inscrito a ningún evento.</div>';
          return;
        }
        cont.innerHTML = mias.map(function (e) {
          return '<div class="card">' +
            '<h4>'+e.evento+'</h4>' +
            '<div class="meta">'+e.fecha+' · '+e.horaInicio+' a '+e.horaFin+'</div>' +
            '<button class="peligro" '+(procesando?'disabled':'')+' onclick="confirmarCancelacion(\''+e.id+'\')">Cancelar mi inscripción</button>' +
            '</div>';
        }).join('');
      })
      .withFailureHandler(mostrarError_)
      .getMisInscripciones(estado.curso, estado.nombres, estado.primerApellido, estado.clave);
  }

  /* ---------- ADMIN ---------- */

  function hacerLoginAdmin() {
    var clave = document.getElementById('input-clave-admin').value;
    document.getElementById('error-admin').textContent = '';
    google.script.run.withSuccessHandler(function (resp) {
      if (!resp.ok) {
        document.getElementById('error-admin').textContent = 'Clave incorrecta.';
        return;
      }
      claveAdmin = clave;
      guardarSesionAdmin_();
      mostrarPantalla('pantalla-admin');
      cargarAdmin();
    }).loginAdmin(clave);
  }

  function cerrarSesionAdmin() {
    claveAdmin = null;
    borrarSesionAdmin_();
    mostrarPantalla('pantalla-curso');
  }

  function cargarAdmin() {
    google.script.run.withSuccessHandler(function (resp) {
      if (!resp.ok) { alert(resp.mensaje); return; }
      renderControlesMes(resp.meses);
      renderEventosAdmin(resp.eventos);
    }).getEventosAdmin(claveAdmin);
    cargarInscripcionesAdmin();
  }

  function renderControlesMes(meses) {
    var cont = document.getElementById('controles-mes');
    if (!meses.length) { cont.innerHTML = '<div class="vacio">No hay eventos cargados.</div>'; return; }
    cont.innerHTML = meses.map(function (m) {
      return '<div class="toggle-mes"><span style="text-transform:capitalize">'+m.nombre+'</span>' +
        '<span>' +
        '<button class="chico" onclick="toggleMes(\''+m.clave+'\', true)">Abrir todos</button> ' +
        '<button class="chico secundario" onclick="toggleMes(\''+m.clave+'\', false)">Cerrar todos</button>' +
        '</span></div>';
    }).join('');
  }

  function toggleMes(mesClave, abierto) {
    google.script.run.withSuccessHandler(function () { cargarAdmin(); })
      .cambiarAbiertoMes(claveAdmin, mesClave, abierto);
  }

  function renderEventosAdmin(eventos) {
    var cont = document.getElementById('lista-eventos-admin');
    cont.innerHTML = eventos.map(function (e) {
      return '<div class="card">' +
        '<h4>'+e.evento+'</h4>' +
        '<div class="meta">'+e.fecha+' · '+e.horaInicio+' a '+e.horaFin+' · '+e.inscritos.length+' inscritos</div>' +
        '<div class="fila-admin">' +
          '<label style="margin:0">Cupo:</label>' +
          '<input type="number" min="0" id="cupo-'+e.id+'" value="'+e.cupo+'">' +
          '<button onclick="guardarCupo(\''+e.id+'\')">Guardar</button>' +
        '</div>' +
        '<div class="fila-admin">' +
          (e.abierto
            ? '<span class="badge ok">Abierto</span><button class="chico secundario" onclick="toggleEvento(\''+e.id+'\', false)">Cerrar</button>'
            : '<span class="badge cerrado">Cerrado</span><button class="chico" onclick="toggleEvento(\''+e.id+'\', true)">Abrir</button>') +
        '</div>' +
        (e.inscritos.length ? '<div class="inscritos"><b>Inscritos:</b> '+e.inscritos.join(', ')+'</div>' : '') +
        '</div>';
    }).join('');
  }

  function toggleEvento(id, abierto) {
    google.script.run.withSuccessHandler(function () { cargarAdmin(); })
      .cambiarAbiertoEvento(claveAdmin, id, abierto);
  }

  function guardarCupo(id) {
    var val = document.getElementById('cupo-' + id).value;
    google.script.run.withSuccessHandler(function () { cargarAdmin(); })
      .actualizarCupo(claveAdmin, id, val);
  }

  function cargarInscripcionesAdmin() {
    google.script.run.withSuccessHandler(function (resp) {
      var cont = document.getElementById('tabla-inscripciones');
      if (!resp.ok) { cont.innerHTML = ''; return; }
      if (!resp.inscripciones.length) { cont.innerHTML = '<div class="vacio">Sin inscripciones aún.</div>'; return; }
      var filas = resp.inscripciones.map(function (i) {
        var claseFila = i.estado === 'Cancelada' ? 'cancelada' : '';
        return '<tr class="'+claseFila+'"><td>'+i.alumno+'</td><td>'+i.curso+'</td><td>'+i.evento+'<br>'+i.fecha+'</td><td>'+i.estado+'</td></tr>';
      }).join('');
      cont.innerHTML = '<table><tr><th>Alumno</th><th>Curso</th><th>Evento</th><th>Estado</th></tr>' + filas + '</table>';
    }).getInscripcionesAdmin(claveAdmin);
  }
</script>
</body>
</html>
